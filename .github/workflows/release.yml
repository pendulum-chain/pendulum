# Reproducible runtime build and release, replacing the GitLab pipeline this
# workflow used to trigger.
#
# The wasm that goes into a runtime-upgrade referendum must be reproducible:
# anyone with the same commit, srtool image and build options must arrive at
# the same hash. The build job builds the runtime inside the srtool image
# pinned by digest (rustc matching rust-toolchain.toml) and records the
# srtool/subwasm report; when a release tag is known, the publish job (the
# only one with write access) attaches the compressed wasm and the report to
# the GitHub release for that tag.
#
# Usage:
#   * Push a tag `pendulum-release-<spec>` (or `amplitude-release-<spec>`) on
#     the commit that bumps spec_version: builds and publishes the release.
#     The tagged commit must be on main, otherwise the run fails.
#   * Run the workflow by hand with a chain and no tag: builds and keeps the
#     artifacts on the run only (a dry run of the pipeline).
name: Release Runtime

on:
  push:
    tags:
      - "pendulum-release-*"
      - "amplitude-release-*"
  workflow_dispatch:
    inputs:
      chain:
        description: Runtime to build
        type: choice
        options: [pendulum, amplitude]
        default: pendulum
      tag:
        description: Existing release tag to publish to (leave empty for a dry run)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: srtool build
    runs-on: ubuntu-latest
    outputs:
      chain: ${{ steps.meta.outputs.chain }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      # srtool passes this to cargo. The runtimes keep CheckMetadataHash in
      # their signed extensions; without the embedded metadata hash every
      # transaction signed with it (mode 1, as Ledger signs) is rejected.
      BUILD_OPTS: --features metadata-hash
      # The srtool image (rustc 1.81.0), pinned by digest so a moved tag cannot
      # change the build.
      SRTOOL_IMAGE_TAG: 1.81.0-0.17.0@sha256:9cff8845b2640c89524f4df6f176c43d55b02d0e75ba58dd517d501b33e26f1a
    steps:
      - name: Resolve chain and tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_CHAIN: ${{ github.event.inputs.chain }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            CHAIN="${TAG%%-release-*}"
          else
            TAG="$INPUT_TAG"
            CHAIN="$INPUT_CHAIN"
          fi
          # A dispatched tag is free text; it goes into step outputs and log lines.
          case "$TAG" in
            *[!A-Za-z0-9._-]*) echo "::error::a release tag may contain only letters, digits, '.', '_' and '-'"; exit 1 ;;
          esac
          case "$CHAIN" in
            pendulum|amplitude) ;;
            *) echo "cannot derive the chain from '$TAG'; expected <chain>-release-<spec>"; exit 1 ;;
          esac
          # A dispatched run takes the chain from its input, so it must match the tag.
          if [ -n "$TAG" ] && [ "${TAG%%-release-*}" != "$CHAIN" ]; then
            echo "::error::$TAG is not a $CHAIN release tag; expected $CHAIN-release-<spec>"
            exit 1
          fi
          echo "chain=$CHAIN" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=${TAG:-$GITHUB_REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 0
          # The srtool container mounts the workspace; keep the token out of it.
          persist-credentials: false

      - name: Check the commit to build
        id: commit
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Releases are published only for commits on main; a dry run may build any ref.
          if [ -n "$TAG" ] && ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG points at $SHA, which is not on main; refusing to publish a release for it"
            exit 1
          fi

      - name: Build with srtool
        id: srtool
        uses: chevdor/srtool-actions@48e9baed50ca414936dfac59d34d8b9bbe581abd # v0.9.2
        with:
          package: ${{ steps.meta.outputs.chain }}-runtime
          runtime_dir: runtime/${{ steps.meta.outputs.chain }}
          # The action runs <image>:<tag>, so the tag carries the digest.
          tag: ${{ env.SRTOOL_IMAGE_TAG }}

      - name: Check that the metadata hash is embedded
        shell: bash
        env:
          WASM: ${{ steps.srtool.outputs.wasm }}
        run: |
          # wasm-builder compiles the hash in as a 0x-prefixed hex string; a runtime
          # without it rejects every transaction signed with the metadata hash.
          # Depending on the data layout, core::fmt's "0x" literal can sit right before
          # one of its digit-only tables ("000102…", "000…0"), so a match must contain
          # a hex letter; a real hash has none with probability 0.625^64.
          HASH="$(LC_ALL=C grep -a -o -E '0x[0-9a-f]{64}' "$WASM" | grep '[a-f]')" || {
            echo "::error::the built runtime embeds no metadata hash; check BUILD_OPTS"
            exit 1
          }
          echo "Metadata hash compiled into the runtime: $HASH"

      - name: Record the srtool report
        shell: bash
        env:
          CHAIN: ${{ steps.meta.outputs.chain }}
          SHA: ${{ steps.commit.outputs.sha }}
          SRTOOL_JSON: ${{ steps.srtool.outputs.json }}
          WASM_COMPRESSED: ${{ steps.srtool.outputs.wasm_compressed }}
        run: |
          printf '%s\n' "$SRTOOL_JSON" | jq . > "srtool-$CHAIN.json"
          {
            echo "## $CHAIN runtime — srtool build"
            echo
            echo "Commit: \`$SHA\`  ·  srtool image: \`paritytech/srtool:$SRTOOL_IMAGE_TAG\`  ·  BUILD_OPTS: \`$BUILD_OPTS\`  ·  reproduce with the same commit, image and BUILD_OPTS."
            echo
            echo "For \`parachainSystem.authorizeUpgrade\` use **\`blake2_256\`** below (the code hash the chain recomputes from the wasm at enactment); \`proposal_hash\` is the preimage hash of a \`system.setCode\` call and \`parachain_authorize_upgrade_hash\` is derived from the authorize call — neither is the value to authorize."
            echo
            echo '```json'
            jq '.runtimes.compressed.subwasm // .' "srtool-$CHAIN.json"
            echo '```'
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          cp "$WASM_COMPRESSED" "./${CHAIN}_runtime.compact.compressed.wasm"
          sha256sum "./${CHAIN}_runtime.compact.compressed.wasm" | tee -a release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.chain }}-runtime-${{ steps.commit.outputs.sha }}
          path: |
            ${{ steps.meta.outputs.chain }}_runtime.compact.compressed.wasm
            srtool-${{ steps.meta.outputs.chain }}.json
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    # A second run for the same tag waits for the first, then finds its assets.
    concurrency:
      group: publish-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.chain }}-runtime-${{ needs.build.outputs.sha }}

      # A published runtime is never rebuilt in place: a later build of the same
      # tag (other build options or image) need not match the hash enacted on
      # chain. Publishing again needs the old assets removed by hand.
      - name: Refuse to change a release that already has assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # The lookup the release action makes; any error but a missing release fails the step.
          if REL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"; then
            ASSETS="$(jq -r '[.assets[].name] | join(" ")' <<<"$REL")"
          elif [ "$(jq -r '.status? // empty' <<<"$REL" 2>/dev/null)" = 404 ]; then
            ASSETS=""
          else
            echo "::error::could not look up the release for $TAG"
            exit 1
          fi
          if [ -n "$ASSETS" ]; then
            echo "::error::release $TAG already has assets ($ASSETS); refusing to change it"
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          body_path: release-notes.md
          # Never delete an attached asset, even one another run added after the check.
          overwrite_files: false
          files: |
            ${{ needs.build.outputs.chain }}_runtime.compact.compressed.wasm
            srtool-${{ needs.build.outputs.chain }}.json
