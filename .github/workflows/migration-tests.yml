name: Migration Tests

# The PEN -> Base migration stack lives outside the Rust workspace: the
# Foundry contracts and the three TypeScript daemons. `test-code.yml` covers
# the pallet through `cargo test`; this job covers everything else, so a
# green check on the PR means the contract and daemon suites actually ran.

on:
  pull_request:
    paths:
      - "contracts/**"
      - "attestor/**"
      - "monitor/**"
      - "releaser/**"
      - ".github/workflows/migration-tests.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    name: Foundry (contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  daemons:
    name: ${{ matrix.package }} (node)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [attestor, monitor, releaser]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and test
        run: npm test
