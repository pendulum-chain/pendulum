name: Test Code

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-code:
    # The bundled RocksDB (librocksdb-sys 0.11) does not build with the GCC of newer images.
    runs-on: ubuntu-24.04
    env:
      # Make sure CI fails on all warnings, including Clippy lints
      RUSTFLAGS: "-Dwarnings"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up Space and Installation
        uses: ./.github/actions/shared

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: cargo test --release

      - name: Test for Runtime Benchmarks
        run: cargo test --release --features=runtime-benchmarks,try-runtime
