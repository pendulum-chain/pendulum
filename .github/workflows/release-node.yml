# This action triggers a GitLab CI job that generates the release notes
name: Node Release

on:
  pull_request:
    types:
      - closed
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  release_check:
#    This job will only run if:
#     * the pull request is closed and merged to main branch;
#     * the pull request has the label "release-node"
    if: ${{ github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release-node')  }}
    name: Need new release
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Node Version
        id: get-version
        run: |
          vers=$( cargo metadata --format-version=1 --no-deps | jq '.packages[] | select(.name == "pendulum-node") | .version' | tr -d '"' )
          echo "version=${vers}" >> "$GITHUB_OUTPUT"

      - name: trigger gitlab
        env:
          GITLAB_TRIGGER: ${{ secrets.GITLAB_TRIGGER }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          ls "$GITHUB_WORKSPACE"
          curl -X POST -F "token=$GITLAB_TRIGGER" -F "ref=development" -F "variables[PREPCOMPILE]=Y" -F "variables[COMPILE]=Y" -F "variables[COMPILEMOONBEAM]=N" -F "variables[DOCKER]=Y" -F "variables[DOCKERAMP]=Y" -F "variables[DEBIAN]=Y"  -F "variables[TEMPUPLOAD]=Y" -F "variables[DOWNUPLOAD]=Y" -F "variables[PRODUPLOAD]=Y" -F "variables[VERSION]=$VERSION" "https://gitlab.com/api/v4/projects/$PROJECT_ID/trigger/pipeline"