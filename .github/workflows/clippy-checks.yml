name: Clippy Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clippy-checks:
    # The bundled RocksDB (librocksdb-sys 0.11) does not build with the GCC of newer images.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up Space and Installation
        uses: ./.github/actions/shared

      - name: Clippy -- Main
        # `manual_inspect` (clippy 1.81) fires inside the `#[pallet::pallet]` expansion of our
        # polkadot-sdk fork; the `deny(warnings)` pallets cannot allow it from the outside.
        run: cargo clippy --release --all-features -- -W clippy::all -A clippy::style -A clippy::manual_inspect -A forgetting_copy_types -A forgetting_references

      - name: Clippy -- All Targets (except integration)
        # We are a bit more forgiving when it comes to the code in tests and only check for correctness
        run: cargo clippy --release --workspace --all-features --all-targets --exclude runtime-integration-tests -- -A clippy::all -W clippy::correctness -A forgetting_copy_types -A forgetting_references

