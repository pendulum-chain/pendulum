# Zombienet: real relay-chain finality for the PEN migration attestors.
# Derived from the repo-root config.toml, with RPC ports pinned so the harness
# can attach. Run from the repo root with a `polkadot` binary on PATH; the
# other paths are relative to the repo root.
[settings]
timeout = 1000

[relaychain]
default_command = "polkadot"
default_args = ["-lparachain=debug"]
chain = "rococo-local"

  [[relaychain.nodes]]
  name = "validator01"
  validator = true

  [[relaychain.nodes]]
  name = "validator02"
  validator = true

[[parachains]]
id = 2094
cumulus_based = true
chain_spec_path = "testing/.zombienet-pendulum-raw.json"

  [parachains.collator]
  name = "alice"
  command = "target/release/pendulum-node"
  rpc_port = 9944
  args = ["-lparachain=info", "-lruntime=info"]
