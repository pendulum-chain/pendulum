name: 'Shared action'
description: 'Frees runner disk space, installs protobuf and caches the cargo registry'
runs:
  using: "composite"
  steps:
    - name: Freeing up more disk space
      run: |
        sudo swapoff -a
        sudo rm -f /mnt/swapfile
        free -h
        sudo rm -rf /usr/local/lib/android # will release about 10 GB if you don't need Android
        sudo rm -rf /usr/share/dotnet # will release about 20GB if you don't need .NET
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /opt/hostedtoolcache
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        # Runner images differ in what they ship; remove only what is installed.
        for pattern in 'php.*' '^mongodb-.*' '^mysql-.*'; do
          sudo apt-get remove -y "$pattern" --fix-missing || echo "nothing matches $pattern"
        done
        for pkg in azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri google-cloud-sdk google-cloud-cli; do
          if dpkg -s "$pkg" >/dev/null 2>&1; then sudo apt-get remove -y "$pkg" --fix-missing; fi
        done
        sudo apt-get autoremove -y
        sudo apt-get clean          
        df -h
      shell: bash

    # Free GitHub Actions Environment Disk Space
    - name: Maximize Build Space
      uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
      with:
        tool-cache: false
        large-packages: false

    # Steps taken from https://github.com/actions/runner-images/issues/7192#issuecomment-1446766800
    - name: Disable Phase Updates
      shell: bash
      run: |
        echo 'APT::Get::Always-Include-Phased-Updates "false";' | sudo tee /etc/apt/apt.conf.d/99-phased-updates

    - name: Update, Upgrade, and Install Protobuf
      shell: bash
      run: |
          sudo apt-get update && sudo apt-get upgrade -y
          sudo apt-get install -y protobuf-compiler libprotobuf-dev

    # Steps taken from https://github.com/actions/cache/blob/master/examples.md#rust---cargo
    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Add rust-src component
      run: rustup component add rust-src
      shell: bash