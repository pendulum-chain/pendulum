# Reproducible runtime build and release, replacing the GitLab pipeline this
# workflow used to trigger.
#
# The wasm that goes into a runtime-upgrade referendum must be reproducible:
# anyone with the same commit, srtool image and build options must arrive at
# the same hash. This job builds the runtime inside the pinned srtool image
# (rustc matching rust-toolchain.toml), records the srtool/subwasm report,
# and — when a release tag is known — attaches the compressed wasm and the
# report to the GitHub release for that tag.
#
# Usage:
#   * Push a tag `pendulum-release-<spec>` (or `amplitude-release-<spec>`) on
#     the commit that bumps spec_version: builds and publishes the release.
#     The tagged commit must be on main, otherwise the run fails.
#   * Run the workflow by hand with a chain and no tag: builds and keeps the
#     artifacts on the run only (a dry run of the pipeline).
name: Release Runtime

on:
  push:
    tags:
      - "pendulum-release-*"
      - "amplitude-release-*"
  workflow_dispatch:
    inputs:
      chain:
        description: Runtime to build
        type: choice
        options: [pendulum, amplitude]
        default: pendulum
      tag:
        description: Existing release tag to publish to (leave empty for a dry run)
        required: false
        default: ""

jobs:
  build:
    name: srtool build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # srtool passes this to cargo. The runtimes keep CheckMetadataHash in
      # their signed extensions; without the embedded metadata hash every
      # transaction signed with it (mode 1, as Ledger signs) is rejected.
      BUILD_OPTS: --features metadata-hash
    steps:
      - name: Resolve chain and tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            CHAIN="${TAG%%-release-*}"
          else
            TAG="${{ github.event.inputs.tag }}"
            CHAIN="${{ github.event.inputs.chain }}"
          fi
          case "$CHAIN" in
            pendulum|amplitude) ;;
            *) echo "cannot derive the chain from '$TAG'; expected <chain>-release-<spec>"; exit 1 ;;
          esac
          # A dispatched run takes the chain from its input, so it must match the tag.
          if [ -n "$TAG" ] && [ "${TAG%%-release-*}" != "$CHAIN" ]; then
            echo "::error::$TAG is not a $CHAIN release tag; expected $CHAIN-release-<spec>"
            exit 1
          fi
          echo "chain=$CHAIN" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=${TAG:-${{ github.ref }}}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 0

      - name: Check the commit to build
        id: commit
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Releases are published only for commits on main; a dry run may build any ref.
          if [ -n "$TAG" ] && ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG points at $SHA, which is not on main; refusing to publish a release for it"
            exit 1
          fi

      - name: Build with srtool
        id: srtool
        uses: chevdor/srtool-actions@v0.9.2
        with:
          package: ${{ steps.meta.outputs.chain }}-runtime
          runtime_dir: runtime/${{ steps.meta.outputs.chain }}
          tag: "1.81.0"

      - name: Check that the metadata hash is embedded
        shell: bash
        env:
          WASM: ${{ steps.srtool.outputs.wasm }}
        run: |
          # wasm-builder compiles the hash in as a 0x-prefixed hex string; a runtime
          # without it rejects every transaction signed with the metadata hash.
          # Depending on the data layout, core::fmt's "0x" literal can sit right before
          # one of its digit-only tables ("000102…", "000…0"), so a match must contain
          # a hex letter; a real hash has none with probability 0.625^64.
          HASH="$(LC_ALL=C grep -a -o -E '0x[0-9a-f]{64}' "$WASM" | grep '[a-f]')" || {
            echo "::error::the built runtime embeds no metadata hash; check BUILD_OPTS"
            exit 1
          }
          echo "Metadata hash compiled into the runtime: $HASH"

      - name: Record the srtool report
        shell: bash
        run: |
          echo '${{ steps.srtool.outputs.json }}' | jq . > srtool-${{ steps.meta.outputs.chain }}.json
          {
            echo "## ${{ steps.meta.outputs.chain }} runtime — srtool build"
            echo
            echo "Commit: \`${{ steps.commit.outputs.sha }}\`  ·  srtool image: \`paritytech/srtool:1.81.0\`  ·  BUILD_OPTS: \`$BUILD_OPTS\`  ·  reproduce with the same commit, image and BUILD_OPTS."
            echo
            echo "For \`parachainSystem.authorizeUpgrade\` use **\`blake2_256\`** below (the code hash the chain recomputes from the wasm at enactment); \`proposal_hash\` is the preimage hash of a \`system.setCode\` call and \`parachain_authorize_upgrade_hash\` is derived from the authorize call — neither is the value to authorize."
            echo
            echo '```json'
            jq '.runtimes.compressed.subwasm // .' srtool-${{ steps.meta.outputs.chain }}.json
            echo '```'
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          cp "${{ steps.srtool.outputs.wasm_compressed }}" ./${{ steps.meta.outputs.chain }}_runtime.compact.compressed.wasm
          sha256sum ./${{ steps.meta.outputs.chain }}_runtime.compact.compressed.wasm | tee -a release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.chain }}-runtime-${{ steps.commit.outputs.sha }}
          path: |
            ${{ steps.meta.outputs.chain }}_runtime.compact.compressed.wasm
            srtool-${{ steps.meta.outputs.chain }}.json
            release-notes.md
          if-no-files-found: error

      - name: Publish the GitHub release
        if: steps.meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          files: |
            ${{ steps.meta.outputs.chain }}_runtime.compact.compressed.wasm
            srtool-${{ steps.meta.outputs.chain }}.json
