name: Test Code

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-code:
    # The bundled RocksDB (librocksdb-sys 0.11) does not build with the GCC of newer images.
    runs-on: ubuntu-24.04
    env:
      # Make sure CI fails on all warnings, including Clippy lints
      RUSTFLAGS: "-Dwarnings"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Free up Space and Installation
        uses: ./.github/actions/shared

      - name: Install Protoc
        uses: arduino/setup-protoc@149f6c87b92550901b26acd1632e11c3662e381f # v1.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: cargo test --release

      - name: Test for Runtime Benchmarks
        run: cargo test --release --features=runtime-benchmarks,try-runtime
